name: Verdict
description: Turn the laravel-workers edge build log into a sticky readiness comment and job summary.
author: laravel-workers
branding:
  icon: check-circle
  color: green

inputs:
  log:
    description: Path to the log of `npx laravel-workers build --no-cache`.
    required: false
    default: edge-build.log
  comment:
    description: '"false" keeps the job summary but skips the pull-request comment.'
    required: false
    default: 'true'
  token:
    description: >
      Token used for the pull-request comment. Defaults to github.token, which
      posts as github-actions[bot]. Pass a GitHub App installation token to have
      the comment authored by your own app (see docs/CI.md, "Comment as your own
      app"); the job summary needs no token either way.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verdict
      shell: bash
      env:
        INPUT_LOG: ${{ inputs.log }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: node "${{ github.action_path }}/main.mjs"
