<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="laravel-workers — compile Laravel to Cloudflare Workers">
  <title>laravel-workers</title>
  <!--
    GitHub social card. Palette: Laravel #ff2d20 -> Cloudflare Workers #f38020.
    The mark is docs/logo.svg, re-used as a transformed group.
  -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d20"/>
      <stop offset="1" stop-color="#f38020"/>
    </linearGradient>
    <linearGradient id="lw-edge" gradientUnits="userSpaceOnUse" x1="146" y1="80" x2="432" y2="372">
      <stop offset="0" stop-color="#ff2d20"/>
      <stop offset="0.55" stop-color="#ff4f20"/>
      <stop offset="1" stop-color="#f38020"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0.1" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ff2d20" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#f38020" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth2" cx="0.95" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#f38020" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="#0b1220"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#warmth)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#warmth2)"/>
  <rect x="0" y="0" width="1280" height="10" fill="url(#edge)"/>

  <g transform="translate(96,72) scale(0.345)">
    <path fill="url(#lw-edge)" d="M132 68h140v240h96l100 64-100 64H132z"/>
  </g>

  <text x="96" y="326" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" fill="#f8fafc">laravel-workers</text>
  <text x="96" y="388" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#a9b6c8">Compile Laravel to a tiny JS bundle</text>
  <text x="96" y="434" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#a9b6c8">that runs on Cloudflare Workers.</text>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="26">
    <text x="96" y="506" fill="#e6edf6">No PHP at the edge  ·  No WASM  ·  No cold-start drama</text>
  </g>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="24">
    <text x="96" y="564" fill="#93a2b6">Blade · PHP · Eloquent</text>
    <text x="452" y="564" fill="#ff2d20">→</text>
    <text x="510" y="564" fill="#93a2b6">compile at build</text>
    <text x="800" y="564" fill="#f38020">→</text>
    <text x="858" y="564" fill="#93a2b6">V8 isolates + D1</text>
  </g>
</svg>
