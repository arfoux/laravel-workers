name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix compiler install
      - run: npm test
      - run: npm run test:corpus
      - run: node tools/docs-check.mjs
      - run: node tools/bench.mjs
      - name: Syntax check shipped ESM
        run: find build.mjs kernel compiler/src compiler/runtime bin tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Pack dry-run
        run: npm pack --dry-run

  e2e-fresh-laravel:
    name: e2e (fresh Laravel, zero config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app
        run: composer create-project laravel/laravel e2e-app --no-interaction --prefer-dist
      - name: Prepare the app
        run: |
          cd e2e-app
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          npm install # a fresh Laravel app ships no package-lock.json, so npm ci cannot be used
          npm run build
      - name: Zero-config strict build with laravel-workers
        run: |
          cd e2e-app
          npm i --no-save --no-package-lock --install-links "$GITHUB_WORKSPACE"
          npx laravel-workers build
      - name: Assert the dist artifact
        run: |
          test -f e2e-app/dist/src/worker.mjs
          test -f e2e-app/dist/src/routes.generated.mjs
          test -f e2e-app/dist/public/index.html
          test -f e2e-app/dist/schema.json
      - name: Runtime smoke (worker boots; / and /health answer 200)
        run: |
          cd e2e-app
          cat > wrangler.jsonc <<'JSONC'
          { "name": "e2e-app", "main": "./dist/src/worker.mjs", "compatibility_date": "2026-10-01",
            "assets": { "directory": "./dist/public", "binding": "ASSETS" },
            "d1_databases": [ { "binding": "DB", "database_name": "e2e-app", "database_id": "placeholder" } ] }
          JSONC
          npx --yes wrangler@4.151.1 dev --port 8791 --ip 127.0.0.1 > dev.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8791/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health=$code"
          if [ "$code" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8791/)
          echo "root=$root"
          if [ "$root" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          kill %1 2>/dev/null || true
          pkill -f workerd 2>/dev/null || true
