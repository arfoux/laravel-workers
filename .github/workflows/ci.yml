name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm --prefix compiler install
      # One definition of "verified" (package.json → tools/check-syntax.mjs):
      # the suite, the corpus, the docs gate, the benchmarks, the shipped
      # sources parsing, and the tarball gate. The release workflow runs the
      # same script, so CI and a release can no longer drift apart.
      - name: Verify (npm run gate:ci)
        run: npm run gate:ci

  # The PHP oracle parity (the real Laravel app vs the compiled rung) needs a
  # Laravel app — the `test` job has none, so those tests skip there. This job
  # creates one and runs them for real.
  parity-oracle:
    name: parity (PHP 8.3 oracle vs the compiled rung)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app (the oracle's app)
        run: composer create-project laravel/laravel parity-app --no-interaction --prefer-dist
      - name: Prepare the app
        run: |
          cd parity-app
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: npm install
      # The scanner is TOTAL, not sampled: the per-helper tests (27 cases) never
      # compared the whole route set with `route:list --json`, which is how
      # `health: "/up"` (framework-registered, not a route file) shipped a 404 on
      # the edge where PHP answers 200. This runs the scan AND the real oracle on
      # a fresh app and asserts the sets are equal, minus the two framework-only
      # routes named in the test. A fresh app is the point: the scan is
      # app-agnostic, so nothing app-specific is needed.
      - name: Create a fresh Laravel app (the route-scan oracle)
        run: composer create-project laravel/laravel scan-app --no-interaction --prefer-dist
      - name: The route scan is total — its set equals route:list
        env:
          LW_LARAVEL_APP: ${{ github.workspace }}/scan-app
        run: node --test tools/tests/routes-oracle-parity.test.mjs
      - name: PHP oracle parity (auth, cache, csrf, session, rate limiter)
        # tools/oracle-ran.mjs runs the set itself and asserts the summary: exit
        # 0, at least one test, and 0 failed/skipped/cancelled/todo. A plain
        # `node --test` here is green even when every oracle test skipped (this
        # job has no app unless LW_LARAVEL_APP points at one), and the old
        # `grep '# skipped 0'` guard on the TAP text also let a *failing* run
        # through.
        env:
          LW_LARAVEL_APP: ${{ github.workspace }}/parity-app
        run: node tools/oracle-ran.mjs

  e2e-fresh-laravel:
    name: e2e (fresh Laravel, zero config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app
        run: composer create-project laravel/laravel e2e-app --no-interaction --prefer-dist
      - name: Prepare the app
        # The frontend needs building (Vite), and prerender/session need a real
        # sqlite file. APP_KEY is NOT prepared: build.mjs auto-generates it
        # (from .env.example when present, or writes a fresh .env with one).
        run: |
          cd e2e-app
          touch database/database.sqlite
          npm install # a fresh Laravel app ships no package-lock.json, so npm ci cannot be used
          npm run build
      - name: The validation-messages module matches the app's framework copy (#429)
        # The `test` job has no Laravel app, so the gate SKIPs this check there.
        # This job owns the app: `--require` turns a missing app into a failure,
        # so the module cannot pass unaudited anywhere.
        env:
          LW_APP_ROOT: ${{ github.workspace }}/e2e-app
        run: node tools/validation-messages-check.mjs --require
      - name: The ascii-map module matches the app's portable-ascii (#294)
        # Same contract as the validation-messages check above: the `test` job
        # has no app, so this job owns it and makes the no-app case fatal.
        env:
          LW_APP_ROOT: ${{ github.workspace }}/e2e-app
        run: node tools/ascii-map-check.mjs --require
      - name: The facade census matches the vendored Facades directory
        # meta.facade_total in tools/constructs.json is a number in a file; this
        # job owns an app, so it can count the directory Laravel actually ships
        # and fail when the two disagree (a new facade would otherwise keep the
        # audit at "47 of 47" while going unclassified).
        env:
          LW_APP_ROOT: ${{ github.workspace }}/e2e-app
        run: node tools/facade-count-check.mjs --require
      - name: Pack the published artifact
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
      - name: Gate — the tarball ships every file the build needs
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in \
            compiler/blade.mjs \
            build.mjs \
            tools/routes-dump.mjs tools/config-dump.mjs tools/schedule-dump.mjs \
            tools/event-dump.mjs tools/class-dump.mjs tools/constants-dump.mjs \
            tools/model-dump.mjs tools/policy-dump.mjs \
            tools/static.mjs tools/php-runtime.mjs; do
            tar tzf laravel-workers-*.tgz | grep -qx "package/$f" || {
              echo "tarball gate FAILED: $f is missing from the packed artifact"; exit 1; }
          done
          echo "tarball gate OK: all build-time modules are shipped"
      - name: Zero-config strict build with laravel-workers (from the tarball)
        run: |
          cd e2e-app
          # The *tarball*, not the workspace: this is the artifact a user installs.
          npm i --no-save --no-package-lock "$GITHUB_WORKSPACE"/laravel-workers-*.tgz
          npx laravel-workers build
      - name: The packaging gate (the installed tarball builds the app)
        run: node tools/pack-smoke.mjs --app e2e-app
      - name: Assert the dist artifact
        run: |
          test -f e2e-app/dist/src/worker.mjs
          test -f e2e-app/dist/src/routes.generated.mjs
          test -f e2e-app/dist/public/index.html
          test -f e2e-app/dist/schema.json
          test -f e2e-app/dist/schema.sql
      - name: The Worker entry obeys the runtime's handler contract
        # The built `dist/src/worker.mjs` is driven with the Workers runtime's
        # real call order — `scheduled(controller, env, ctx)` — and must read the
        # real env bindings. The `test` job has no built app, so this is the only
        # place the shipped entry is exercised (the shadow harness never calls
        # `scheduled()`). `oracle-ran.mjs` fails the step unless the test really
        # RAN: a plain `node --test` exits 0 even when it skips.
        env:
          LW_LARAVEL_APP: ${{ github.workspace }}/e2e-app
        run: |
          test -f e2e-app/dist/kernel/http.mjs
          node tools/oracle-ran.mjs kernel/tests/worker-entry.test.mjs
      - name: Runtime smoke (worker boots; / and /health answer 200)
        run: |
          cd e2e-app
          cat > wrangler.jsonc <<'JSONC'
          { "name": "e2e-app", "main": "./dist/src/worker.mjs", "compatibility_date": "2026-10-01",
            "assets": { "directory": "./dist/public", "binding": "ASSETS" },
            "d1_databases": [ { "binding": "DB", "database_name": "e2e-app", "database_id": "placeholder" } ] }
          JSONC
          npx --yes wrangler@4.151.1 dev --port 8791 --ip 127.0.0.1 > dev.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8791/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health=$code"
          if [ "$code" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8791/)
          echo "root=$root"
          if [ "$root" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          kill %1 2>/dev/null || true
          pkill -f workerd 2>/dev/null || true
