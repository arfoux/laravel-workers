name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix compiler install
      - run: npm test
      - run: npm run test:corpus
      - run: node tools/docs-check.mjs
      - run: node tools/bench.mjs
