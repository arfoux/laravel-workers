name: app-check

# Official build check for APP repositories. It only compiles and reports.
# Call it from whatever trigger fits the app — pull_request, push to main,
# schedule, workflow_dispatch — the check is the same:
#
#   jobs:
#     check:
#       uses: arfoux/laravel-workers/.github/workflows/app-check.yml@v1
#       permissions:
#         contents: read
#         pull-requests: write   # Verdict comment
#         issues: write          # issue comments on a PR
#
# `build --strict`: green means every route is accounted for — compiled,
# snapshotted, ported, or a declared gap. Never just "it compiled".

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for composer, artisan and the config dump.
        type: string
        default: '8.3'
      node-version:
        description: Node version for the compiler and the reporter.
        type: string
        default: '22'
      working-directory:
        description: App root, for monorepos.
        type: string
        default: '.'
      build-args:
        description: Extra arguments for `laravel-workers build`. Keep --no-cache.
        type: string
        default: '--no-cache'
      lint:
        description: Run `vendor/bin/pint --test` after the gate.
        type: boolean
        default: true
      tests:
        description: Run `php artisan test` after the gate.
        type: boolean
        default: true
      app-id:
        description: >
          Optional. With your app's private key passed as the LW_APP_PRIVATE_KEY
          secret (`secrets: inherit`), Verdict comments as your app instead of
          github-actions[bot]. Leave empty for the zero-secret default.
        type: string
        default: ''

jobs:
  check:
    name: Edge check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # Composer stays ONLY here: when `tests` runs `php artisan test`, PHPUnit
      # comes from require-dev, and vendor-lite never provisions require-dev.
      # The build itself does not need it (vendor-lite reads composer.lock).
      - name: Install Composer dependencies
        working-directory: ${{ inputs.working-directory }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      # The edge build reads the Vite manifest while compiling Blade.
      - name: Build assets
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

      - name: Prepare environment
        working-directory: ${{ inputs.working-directory }}
        run: cp .env.example .env

      # A random key per run: a pull request never builds with the production
      # key. It must stay VALID (base64 + 32 bytes) — compiling error views
      # boots Laravel and a malformed key fails with
      # "Unsupported cipher or incorrect key length".
      - name: Generate random app_key (never production)
        run: |
          KEY="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64"))')"
          echo "APP_KEY=base64:${KEY}" >> "$GITHUB_ENV"

      # --strict: RUNS ON THE EDGE and RUNS WITH DECLARED GAPS pass; BLOCK fails.
      # --no-cache is mandatory: a cache hit prints no READINESS block at all.
      - name: Edge build (--strict)
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -o pipefail
          npx laravel-workers build ${{ inputs.build-args }} 2>&1 | tee edge-build.log

      # Verdict ships in this repo and is released with these workflows: the
      # caller pins @v1 and both stay in step.
      #
      # A fork pull request is skipped on purpose: the app token carries WRITE,
      # so minting one for a PR nobody has reviewed would hand an untrusted
      # branch the repo's comment permissions. The default github.token is
      # read-only on forks, which is the safe half of the same trade.
      - name: Verdict token (optional — comment as your app)
        id: verdict-token
        if: ${{ inputs.app-id != '' && github.event.pull_request.head.repo.fork != true }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.LW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Verdict
        if: always()
        uses: arfoux/laravel-workers/action/verdict@v1
        with:
          log: ${{ inputs.working-directory }}/edge-build.log
          token: ${{ steps.verdict-token.outputs.token || '' }}

      - name: Check code style
        if: ${{ inputs.lint }}
        working-directory: ${{ inputs.working-directory }}
        run: vendor/bin/pint --test --format agent

      - name: Run tests
        if: ${{ inputs.tests }}
        working-directory: ${{ inputs.working-directory }}
        run: php artisan test --compact
