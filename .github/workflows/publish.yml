name: publish

on:
  push:
    tags:
      - "v*"

# Release = a tag, not a version edit: `npm version patch` (omit
# --no-git-tag-version) writes package.json, commits and creates the `v*` tag in
# one act, then `git push && git push --follow-tags`. Editing package.json by
# hand (or with --no-git-tag-version) publishes nothing — this workflow listens
# for tags. Publishing on every push to main would be worse: a mid-development
# merge would cut a release and npm rejects a version that already exists.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must name the version package.json carries
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want) — retag the release commit" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix compiler install
      - run: npm test
      - run: npm run test:corpus
      - run: node tools/gate.mjs --strict
      - name: Syntax check shipped ESM
        run: find build.mjs kernel compiler/src compiler/runtime bin tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm pack --dry-run
      - run: npm config delete '//registry.npmjs.org/:_authToken'
        continue-on-error: true
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
  publish-gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix compiler install
      - run: npm test
      - run: npm run test:corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@arfoux'
      - run: npm install -g npm@latest
      - name: Publish to GitHub Packages as scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json /tmp/package.json.bak
          npm pkg set name=@arfoux/laravel-workers
          npm publish --registry=https://npm.pkg.github.com --access public
          cp /tmp/package.json.bak package.json
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([ ]|—|-|$)" { in_sec=1; next }
              /^## / { if (in_sec) exit }
              in_sec { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release $TAG" > /tmp/notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
