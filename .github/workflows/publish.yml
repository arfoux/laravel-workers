name: publish

on:
  push:
    tags:
      - "v*"

# One run per ref (the ref here is a tag, so two different tags never collide).
# `cancel-in-progress: false` on purpose: this workflow runs `npm publish`, and
# cancelling a publish mid-flight is how a version gets wedged — the registry
# keeps the version number while the release, the GPR copy and the attestation
# never happen, and the re-run then dies with E409 "cannot publish over the
# previously published versions". A second run on the same tag QUEUES instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The skeleton the shadow harness installs is PINNED: an unpinned
# `create-project` installs whatever laravel/laravel ships that day, so the
# release gate could start proving something else without a commit here. Bump it
# deliberately, when the new skeleton is verified. `ci.yml` pins the same
# version, so the two never disagree.
env:
  LARAVEL_SKELETON: laravel/laravel:13.11.0
  # `npm@latest` changed the publisher between releases; v0.5.1 was published
  # with npm 12.2.2. Pin that exact version so registry auth/provenance and the
  # bytes in the tarball stay reproducible. Bump deliberately when the next
  # release is published with a different npm version.
  PUBLISH_NPM_VERSION: 12.2.2

# Release = a tag, not a version edit: `npm version patch` (omit
# --no-git-tag-version) writes package.json, commits and creates the `v*` tag in
# one act, then `git push && git push --follow-tags`. Editing package.json by
# hand (or with --no-git-tag-version) publishes nothing — this workflow listens
# for tags. Publishing on every push to main would be worse: a mid-development
# merge would cut a release and npm rejects a version that already exists.
jobs:
  # The shadow harness is the release gate: a real Laravel app (PHP 8.3 + the
  # PHP oracle) is replayed against the compiled worker and diffed byte-wise.
  # Publishing must not proceed unless parity holds; `publish` and `publish-gpr`
  # both `needs` it, so a regression here blocks the release outright.
  shadow:
    name: shadow harness (real Laravel vs compiled worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app (the oracle's app)
        run: composer create-project "$LARAVEL_SKELETON" shadow-app --no-interaction --prefer-dist
      - name: Scaffold the fixture app the scenario replays
        # `shadow/scenarios/fresh-app.mjs` walks the login flow, the guarded
        # dashboard and the post list/detail, and its fixtures INSERT into a
        # `posts` table. A vanilla skeleton has one route and no such table, so
        # without this step the release gate could never pass.
        run: node shadow/fixture-app.mjs shadow-app
      - name: Prepare the app
        run: |
          cd shadow-app
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: npm ci
      - name: Shadow — real PHP app vs the compiled worker (byte-wise diff)
        run: node shadow/run.mjs --app shadow-app --scenarios shadow/scenarios/fresh-app.mjs --build

  # ONE verify job for the release (S5): `publish` and `publish-gpr` each ran
  # `npm run gate:ci`, so one release was verified twice — and the second copy
  # could only ever block the job behind it. Both now `needs: verify`.
  verify:
    needs: shadow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix compiler ci
      # The same script CI runs on every push (package.json → `gate:ci`): the
      # suite, the corpus, the docs gate, the benchmarks, the shipped sources
      # parsing, and the tarball gate. Writing the steps out again per publish
      # job is how the release gate drifted behind CI in the first place.
      - name: Verify (npm run gate:ci)
        run: npm run gate:ci

  # `gate:ci` checks the import graph, not the artifact a user installs. This
  # job walks the consumer path: pack the repo, install the tarball in a real
  # Laravel app, strict-build it, then run the pack-smoke and runtime smoke
  # checks ci.yml's e2e job owns. Publishing depends on it, so a tarball that
  # cannot build cannot ship even if the unit gates pass.
  tarball:
    name: real tarball install + strict build + runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app (the consumer)
        run: composer create-project "$LARAVEL_SKELETON" tarball-app --no-interaction --prefer-dist
      - name: Prepare the app
        run: |
          cd tarball-app
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Build the app's assets (the build reads the Vite manifest)
        run: |
          cd tarball-app
          # A fresh Laravel skeleton ships no package-lock.json, so npm ci
          # cannot be used for the APP's own dependencies here.
          npm install
          npm run build
      - run: npm ci
      - name: Pack the published artifact
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
      - name: Gate — the tarball ships every file the build needs
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in \
            compiler/blade.mjs \
            build.mjs \
            tools/routes-dump.mjs tools/config-dump.mjs tools/schedule-dump.mjs \
            tools/event-dump.mjs tools/class-dump.mjs tools/constants-dump.mjs \
            tools/model-dump.mjs tools/policy-dump.mjs \
            tools/static.mjs tools/php-runtime.mjs; do
            tar tzf laravel-workers-*.tgz | grep -qx "package/$f" || {
              echo "tarball gate FAILED: $f is missing from the packed artifact"; exit 1; }
          done
          echo "tarball gate OK: all build-time modules are shipped"
      - name: Zero-config strict build with laravel-workers (from the tarball)
        run: |
          cd tarball-app
          # The *tarball*, not the workspace: this is the artifact a user installs.
          npm i --no-save --no-package-lock "$GITHUB_WORKSPACE"/laravel-workers-*.tgz
          npx laravel-workers build
      - name: The packaging gate (the installed tarball builds the app)
        run: node tools/pack-smoke.mjs --app tarball-app
      - name: Assert the dist artifact
        run: |
          test -f tarball-app/dist/src/worker.mjs
          test -f tarball-app/dist/src/routes.generated.mjs
          test -f tarball-app/dist/public/index.html
          test -f tarball-app/dist/public/404.html
          test -f tarball-app/dist/schema.json
          test -f tarball-app/dist/schema.sql
          grep -q '"not_found_handling": "404-page"' tarball-app/wrangler.jsonc
      - name: The Worker entry obeys the runtime's handler contract
        env:
          LW_LARAVEL_APP: ${{ github.workspace }}/tarball-app
        run: |
          test -f tarball-app/dist/kernel/http.mjs
          node tools/oracle-ran.mjs kernel/tests/worker-entry.test.mjs
      - name: Runtime smoke (worker boots; / and /health answer 200)
        run: |
          cd tarball-app
          cat > wrangler.jsonc <<'JSONC'
          { "name": "tarball-app", "main": "./dist/src/worker.mjs", "compatibility_date": "2026-10-01",
            "assets": { "directory": "./dist/public", "binding": "ASSETS", "not_found_handling": "404-page" },
            "d1_databases": [ { "binding": "DB", "database_name": "tarball-app", "database_id": "placeholder" } ] }
          JSONC
          npx --yes wrangler@4.151.1 dev --port 8792 --ip 127.0.0.1 > dev.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8792/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health=$code"
          if [ "$code" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8792/)
          echo "root=$root"
          if [ "$root" != "200" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          nf=$(curl -s -o /tmp/nf.html -w '%{http_code}' --max-time 10 http://127.0.0.1:8792/nonexistent-route-for-404)
          echo "unknown-path=$nf bytes=$(wc -c < /tmp/nf.html)"
          if [ "$nf" != "404" ]; then echo "--- dev.log ---"; tail -n 60 dev.log; exit 1; fi
          if ! cmp -s /tmp/nf.html dist/public/404.html; then
            echo "the unknown-path 404 body is not the app's 404 page:"
            wc -c /tmp/nf.html dist/public/404.html
            exit 1
          fi
          kill %1 2>/dev/null || true
          pkill -f workerd 2>/dev/null || true

  publish:
    needs: [shadow, verify, tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag must name the version package.json carries
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want) — retag the release commit" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm config delete '//registry.npmjs.org/:_authToken'
        continue-on-error: true
      - run: npm install -g "npm@${PUBLISH_NPM_VERSION}"
      - run: npm publish --provenance --access public
  publish-gpr:
    needs: [shadow, verify, tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag must name the version package.json carries
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want) — retag the release commit" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@arfoux'
      - run: npm install -g "npm@${PUBLISH_NPM_VERSION}"
      - name: Publish to GitHub Packages as scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json /tmp/package.json.bak
          # The scope rename edits the checked-out package.json; the trap
          # restores it on the way out however this step ends, so a failed
          # publish cannot leave the runner's manifest renamed for the steps
          # that follow.
          trap 'cp /tmp/package.json.bak package.json' EXIT
          npm pkg set name=@arfoux/laravel-workers
          npm publish --registry=https://npm.pkg.github.com --access public
  release:
    # A GitHub release must not appear unless BOTH registries published the tag —
    # without both `needs` the Release could go green while npm or GPR failed.
    needs: [publish, publish-gpr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([ ]|—|-|$)" { in_sec=1; next }
              /^## / { if (in_sec) exit }
              in_sec { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release $TAG" > /tmp/notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
