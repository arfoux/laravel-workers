name: publish

on:
  push:
    tags:
      - "v*"

# One run per ref (the ref here is a tag, so two different tags never collide).
# `cancel-in-progress: false` on purpose: this workflow runs `npm publish`, and
# cancelling a publish mid-flight is how a version gets wedged — the registry
# keeps the version number while the release, the GPR copy and the attestation
# never happen, and the re-run then dies with E409 "cannot publish over the
# previously published versions". A second run on the same tag QUEUES instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Release = a tag, not a version edit: `npm version patch` (omit
# --no-git-tag-version) writes package.json, commits and creates the `v*` tag in
# one act, then `git push && git push --follow-tags`. Editing package.json by
# hand (or with --no-git-tag-version) publishes nothing — this workflow listens
# for tags. Publishing on every push to main would be worse: a mid-development
# merge would cut a release and npm rejects a version that already exists.
jobs:
  # The shadow harness is the release gate: a real Laravel app (PHP 8.3 + the
  # PHP oracle) is replayed against the compiled worker and diffed byte-wise.
  # Publishing must not proceed unless parity holds; `publish` and `publish-gpr`
  # both `needs` it, so a regression here blocks the release outright.
  shadow:
    name: shadow harness (real Laravel vs compiled worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Create a fresh Laravel app (the oracle's app)
        # The skeleton is PINNED: an unpinned `create-project` installs whatever
        # laravel/laravel ships that day, so a change upstream could break the gate
        # (or silently change what it proves) without a commit here. Bump it
        # deliberately when the new skeleton is verified.
        
        run: composer create-project "laravel/laravel:13.11.0" shadow-app --no-interaction --prefer-dist
      - name: Scaffold the fixture app the scenario replays
        # `shadow/scenarios/fresh-app.mjs` walks the login flow, the guarded
        # dashboard and the post list/detail, and its fixtures INSERT into a
        # `posts` table. A vanilla skeleton has one route and no such table, so
        # without this step the release gate could never pass.
        run: node shadow/fixture-app.mjs shadow-app
      - name: Prepare the app
        run: |
          cd shadow-app
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: npm install
      - name: Shadow — real PHP app vs the compiled worker (byte-wise diff)
        run: node shadow/run.mjs --app shadow-app --scenarios shadow/scenarios/fresh-app.mjs --build

  # ONE verify job for the release (S5): `publish` and `publish-gpr` each ran
  # `npm run gate:ci`, so one release was verified twice — and the second copy
  # could only ever block the job behind it. Both now `needs: verify`.
  verify:
    needs: shadow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm --prefix compiler install
      # The same script CI runs on every push (package.json → `gate:ci`): the
      # suite, the corpus, the docs gate, the benchmarks, the shipped sources
      # parsing, and the tarball gate. Writing the steps out again per publish
      # job is how the release gate drifted behind CI in the first place.
      - name: Verify (npm run gate:ci)
        run: npm run gate:ci

  publish:
    needs: [shadow, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag must name the version package.json carries
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want) — retag the release commit" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm config delete '//registry.npmjs.org/:_authToken'
        continue-on-error: true
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
  publish-gpr:
    needs: [shadow, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@arfoux'
      - run: npm install -g npm@latest
      - name: Publish to GitHub Packages as scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json /tmp/package.json.bak
          # The scope rename edits the checked-out package.json; the trap
          # restores it on the way out however this step ends, so a failed
          # publish cannot leave the runner's manifest renamed for the steps
          # that follow.
          trap 'cp /tmp/package.json.bak package.json' EXIT
          npm pkg set name=@arfoux/laravel-workers
          npm publish --registry=https://npm.pkg.github.com --access public
  release:
    # A GitHub release must not appear unless npm actually published the tag —
    # without this the Release could go green while `npm publish` failed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([ ]|—|-|$)" { in_sec=1; next }
              /^## / { if (in_sec) exit }
              in_sec { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release $TAG" > /tmp/notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
